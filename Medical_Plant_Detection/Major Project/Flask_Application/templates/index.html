<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Plant Detection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.8s ease-in-out;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }
        label {
            font-size: 16px;
            color: #555;
            margin-bottom: 15px;
            display: block;
        }
        input[type="file"] {
            margin: 15px 0;
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="file"]:hover {
            border-color: #007BFF;
            background-color: #f9f9f9;
        }
        button {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 25px;
            font-size: 18px;
            color: #28a745;
            font-weight: 500;
            animation: slideUp 0.5s ease-in-out;
        }
        .result strong {
            color: #333;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌿 Medical Plant Detection System 🌿</h2>
        <form action="/predict" method="post" enctype="multipart/form-data">
            <label for="file">Upload a Plant Image</label>
            <input type="file" name="file" accept="image/*" required>
            <button type="submit"><i class="fas fa-search"></i> Predict</button>
        </form>

        <!-- This is where the prediction result will appear -->
        {% if result %}
        <div class="result">
            <p>Predicted Plant Class: <strong>{{ result }}</strong></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
