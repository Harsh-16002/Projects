<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 800px;
            animation: fadeIn 0.8s ease-in-out;
        }
        h2 {
            color: #333;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .image-container {
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            background: #f8f9fa;
            padding: 10px;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: contain;
        }
        .benefits {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .benefits h4 {
            color: #333;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: #007BFF;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.2s;
            width: 100%;
            max-width: 200px;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Scrollbar styling for image container */
        .image-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .image-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .image-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .image-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Prediction Result: <strong>{{ result }}</strong></h2>
        <div class="image-container">
            <img src="{{ image_path }}" alt="Uploaded Image">
        </div>
        <div class="benefits">
            <h4>Benefits:</h4>
            <p>{{ benefits }}</p>
        </div>
        <a href="/start" class="btn btn-primary">Go Back</a>
    </div>
</body>
</html>
