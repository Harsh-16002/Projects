<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Downloader</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">
    <h2 class="text-center">YouTube Playlist Downloader</h2>
    
    <div class="card p-4 bg-secondary">
        <label for="playlist_url" class="form-label">Enter Playlist URL:</label>
        <input type="text" id="playlist_url" class="form-control" placeholder="https://www.youtube.com/playlist?list=..." required>

        <button class="btn btn-primary mt-3" onclick="fetchQualities()">Get Available Qualities</button>

        <!-- Fetching Spinner -->
        <div id="fetch_spinner" class="spinner-border text-light mt-3" role="status" style="display: none;">
            <span class="visually-hidden">Fetching...</span>
        </div>

        <!-- Progress Bar for Fetching Qualities -->
        <div class="progress mt-3" style="height: 10px; display: none;" id="fetch_progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" id="fetch_progress_bar"></div>
        </div>

        <div id="quality_section" class="mt-3" style="display: none;">
            <label for="quality" class="form-label">Select Quality:</label>
            <select id="quality" class="form-control"></select>
            <button class="btn btn-success mt-3" onclick="downloadPlaylist()">Download</button>
        </div>

        <!-- Downloading Spinner -->
        <div id="download_spinner" class="spinner-border text-light mt-3" role="status" style="display: none;">
            <span class="visually-hidden">Downloading...</span>
        </div>

        <!-- Progress Bar for Downloading -->
        <div class="progress mt-3" style="height: 10px; display: none;" id="download_progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" id="download_progress_bar"></div>
        </div>

        <div id="status" class="mt-3"></div>
    </div>
</div>

<script>
function fetchQualities() {
    const playlistUrl = document.getElementById("playlist_url").value;
    if (!playlistUrl) {
        alert("Please enter a valid playlist URL!");
        return;
    }

    // Show fetching spinner
    document.getElementById("fetch_spinner").style.display = "inline-block";
    document.getElementById("fetch_progress").style.display = "block";
    let progressBar = document.getElementById("fetch_progress_bar");
    progressBar.style.width = "10%";

    fetch("/get_qualities", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ playlist_url: playlistUrl })
    })
    .then(response => response.json())
    .then(data => {
        progressBar.style.width = "70%";

        if (data.error) {
            alert(data.error);
            progressBar.style.width = "0%";
            document.getElementById("fetch_progress").style.display = "none";
            document.getElementById("fetch_spinner").style.display = "none";
            return;
        }

        const qualityDropdown = document.getElementById("quality");
        qualityDropdown.innerHTML = "";
        data.qualities.forEach(q => {
            let option = document.createElement("option");
            option.value = q;
            option.innerText = q;
            qualityDropdown.appendChild(option);
        });

        document.getElementById("quality_section").style.display = "block";
        progressBar.style.width = "100%";
        setTimeout(() => {
            document.getElementById("fetch_progress").style.display = "none";
        }, 500);
    })
    .catch(error => {
        console.error("Error fetching qualities:", error);
        progressBar.style.width = "0%";
    })
    .finally(() => {
        document.getElementById("fetch_spinner").style.display = "none";
    });
}

function downloadPlaylist() {
    const playlistUrl = document.getElementById("playlist_url").value;
    const quality = document.getElementById("quality").value;

    document.getElementById("status").innerHTML = "Downloading, please wait...";

    // Show download progress bar and spinner
    document.getElementById("download_progress").style.display = "block";
    document.getElementById("download_spinner").style.display = "inline-block";
    let downloadBar = document.getElementById("download_progress_bar");
    downloadBar.style.width = "10%";

    let progress = 10;
    let interval = setInterval(() => {
        progress += 10;
        if (progress >= 90) clearInterval(interval);
        downloadBar.style.width = progress + "%";
    }, 1000);

    fetch("/download_playlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ playlist_url: playlistUrl, quality: quality })
    })
    .then(response => response.json())
    .then(data => {
        clearInterval(interval);
        downloadBar.style.width = "100%";
        document.getElementById("status").innerHTML = `<b>${data.message}</b>`;
        setTimeout(() => {
            document.getElementById("download_progress").style.display = "none";
        }, 1000);
    })
    .catch(error => {
        console.error("Download error:", error);
        clearInterval(interval);
        downloadBar.style.width = "0%";
    })
    .finally(() => {
        document.getElementById("download_spinner").style.display = "none";
    });
}
</script>

</body>
</html>
